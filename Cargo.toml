[package]
name = "orbital-core"
version = "0.1.0"
edition = "2021"
description = "ORBITAL CORE v0.1 - single-machine HOST daemon"

[dependencies]
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "time", "signal", "sync", "io-util"] }
rusqlite = { version = "0.31", features = ["bundled"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hyper = { version = "1.3", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "tokio"] }
http-body-util = "0.1"
bytes = "1.6"
thiserror = "1.0"
hex = "0.4"
libc = "0.2"

[dev-dependencies]
tempfile = "3.10"

[profile.release]
panic = "abort"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization", "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_Storage_FileSystem",
] }